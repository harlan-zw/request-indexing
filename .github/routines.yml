# Scheduled agent work for this repository.
#
# harlan-github-agent reads this file from the default branch only, and never
# from a pull request head. It may set the schedule, the mode, and enabled. It
# cannot name a command, a model, or any new authority.
#
# mode: propose sends actionable Candidates to issue triage.
# Both modes publish the run report to the existing tracking issue.
# mode: report does not propose Candidate issues.
version: 1
routines:
  - name: daily-checkin
    on:
      schedule:
        - cron: '0 6 * * *'
    timezone: Australia/Sydney
    mode: propose
    enabled: true
