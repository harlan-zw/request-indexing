name = "request-indexing-edge"
main = "src/index.ts"
compatibility_date = "2025-01-15"
workers_dev = true

# This Worker is intended to be deployed in front of a customer origin
# via a Cloudflare route or a CNAME on a custom domain. It observes,
# it does not modify (yet). Pass-through with logging.

[vars]
ORIGIN_URL = "https://example.com"
SITE_ID = "demo"

[[d1_databases]]
binding = "DB"
database_name = "request-indexing-edge"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[observability]
enabled = true
