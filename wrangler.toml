name = "request-indexing"
account_id = "5904138d55ca25d5670dca6adf99894e"
compatibility_date = "2026-08-11"
# Must match `nitro.cloudflare.wrangler.compatibility_flags` in nuxt.config.ts.
# Nitro merges both sources into .output/server/wrangler.json, and Cloudflare
# rejects a deploy carrying `nodejs_compat` and `nodejs_compat_v2` together.
# `nodejs_compat_v2` is the one that keeps Nitro from pinning v1: with
# `cloudflare.nodeCompat: true` it only adds `no_nodejs_compat_v2` when v2 is
# not already declared.
compatibility_flags = [ "nodejs_compat_v2" ]
main = ".output/server/index.mjs"
workers_dev = false
preview_urls = false

[cache]
enabled = true
cross_version_cache = false

[placement]
mode = "smart"

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[assets]
directory = ".output/public"
html_handling = "drop-trailing-slash"

[[d1_databases]]
binding = "DB"
database_name = "request-indexin-bw2z"
database_id = "233eb802-c278-4900-9dcb-7f0316eed6b4"
migrations_dir = "layers/core/server/db/migrations"

[[r2_buckets]]
binding = "BLOB"
bucket_name = "request-indexin-bw2z"

[[kv_namespaces]]
binding = "KV"
id = "9ba09cd123b948f6835f5d20b2d97f6c"

[[kv_namespaces]]
binding = "CACHE"
id = "9aa5f0d4250c45ffa75d7bed3646ea30"

# Rest of config (crons, vars, etc.) is in nuxt.config.ts
