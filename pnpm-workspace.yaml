minimumReleaseAgeExclude:
  - '@harlan-zw/nuxt-dx@0.0.1'
  - nuxt-ai-ready@1.7.9
  - nuxt-skew-protection@1.4.3

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # Nuxt's vite-plugin-checker still resolves this release without provenance.
  - chokidar@4.0.3
  # Existing Babel transitive predates npm provenance.
  - semver@6.3.1
  # Existing Wrangler 3/Miniflare transitive. This release predates npm
  # provenance for undici; keep the exception exact so newer versions remain
  # covered by the no-downgrade policy.
  - undici@5.29.0

packages:
  - apps/*
  - layers/*
  - worker

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  maplibre-gl: true
  protobufjs: true
  sharp: true
  vue-demi: true
  workerd: true
overrides:
  oxc-parser: 'catalog:'
  # Keep Nitro's Worker bundle reproducible on the version proven by
  # nuxtseo.com instead of floating across Rolldown patch releases.
  rolldown: 1.2.3
  sharp: 0.35.3
  unplugin: 'catalog:'
  # SSR must use one Vue instance. A second peer context loses Nuxt's
  # injection context during prerender.
  vue: 3.5.41
patchedDependencies:
  '@nuxt/ui@4.10.0': patches/@nuxt__ui@4.10.0.patch
catalog:
  '@antfu/eslint-config': ^9.3.0
  '@cloudflare/workers-types': ^5.20260810.1
  '@gscdump/contracts': ^2.0.6
  '@gscdump/engine': ^2.0.6
  '@gscdump/sdk': ^2.0.6
  '@harlan-zw/nuxt-dx': 0.0.1
  '@iconify-json/carbon': ^1.2.25
  '@iconify-json/circle-flags': ^1.2.10
  '@iconify-json/heroicons': ^1.2.3
  '@iconify-json/logos': ^1.2.12
  '@iconify-json/ph': ^1.2.2
  '@iconify-json/simple-icons': ^1.2.93
  '@internationalized/date': ^3.12.3
  '@nuxt/content': ^3.15.2
  '@nuxt/fonts': 0.14.0
  '@nuxt/image': ^2.1.0
  '@nuxt/scripts': ^1.3.3
  '@nuxt/test-utils': ^4.1.0
  '@nuxt/ui': ^4.10.0
  '@nuxtjs/robots': ^6.1.4
  '@nuxtjs/seo': ^5.3.12
  '@nuxtjs/sitemap': ^8.3.4
  '@sentry/nuxt': ^10.69.0
  '@takumi-rs/core': ^2.6.1
  '@takumi-rs/wasm': ^2.6.1
  '@tanstack/table-core': ^9.1.2
  '@tanstack/vue-table': ^9.1.2
  '@tanstack/vue-table-v8': npm:@tanstack/vue-table@8.21.3
  '@unovis/ts': ^1.6.7
  '@unovis/vue': ^1.6.7
  '@vueuse/core': ^14.4.0
  '@vueuse/nuxt': ^14.4.0
  better-sqlite3: ^13.0.3
  bumpp: ^12.2.0
  cheerio: ^1.2.0
  date-fns: ^4.4.0
  date-fns-tz: ^3.2.0
  devalue: ^5.9.0
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  eslint: ^10.8.1
  google-ads-api: ^24.1.0
  googleapis-common: ^9.0.1
  googlethis: ^1.8.0
  gscdump: ^2.0.6
  h3: ^1.15.11
  hookable: ^6.1.1
  klona: ^2.0.6
  lightweight-charts: ^5.2.0
  motion-v: 2.3.0
  nanoid: ^6.0.1
  nitro-cloudflare-dev: ^0.2.2
  node-fetch: ^3.3.2
  nuxt: ^4.5.2
  nuxt-ai-ready: ^1.7.9
  nuxt-auth-utils: ^0.5.30
  nuxt-og-image: ^6.7.6
  nuxt-schema-org: ^6.2.9
  nuxt-skew-protection: ^1.4.3
  oxc-parser: 0.143.0
  postmark: ^5.1.0
  reka-ui: ^2.10.3
  scule: ^1.3.0
  sitemapper: ^4.1.6
  stripe: ^22.4.0
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  ufo: ^1.6.4
  uncrypto: ^0.1.3
  unplugin: ^3.3.0
  v-calendar: ^3.1.2
  vitest: ^4.1.10
  vue: ^3.5.41
  vue-router: ^5.2.0
  vue-tsc: ^3.3.9
  wrangler: ^4.120.0
  zod: ^4.4.3
onlyBuiltDependencies:
  - better-sqlite3
peerDependencyRules:
  allowedVersions:
    # Nuxt Content 3.15 caps this at 12, but prepare and type generation pass on 13.
    better-sqlite3: '13'
